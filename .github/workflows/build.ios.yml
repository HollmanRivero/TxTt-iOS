name: Build iOS App

# Bygger appen i skyen ved hver push til main, eller manuelt fra Actions-fanen.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    # iOS KREVER en macOS-maskin for å kunne bygge
    runs-on: macos-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Create .env.local (fra GitHub Secrets)
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env.local
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env.local

      - name: Build web app (Vite)
        run: npm run build

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync Capacitor to iOS
        run: npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Build Xcode Project (Unsigned)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -allowProvisioningUpdates \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build

      # Dette pakker det ferdige resultatet inn i en zip-fil du kan laste ned
      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TxTt-iOS-Build
          path: ios/App/DerivedData/Build/Products/Release-iphoneos/App.app
          if-no-files-found: error